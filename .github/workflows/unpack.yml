name: Unpack question pack

on:
  push:
    paths:
      - "inbox/*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digimath
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into content/
        run: |
          shopt -s nullglob
          for z in inbox/*.zip; do
            unzip -o -q "$z" -d content/
            git rm -q "$z"
          done
          ls content
      - name: Commit
        run: |
          git config user.name "digimath-bot"
          git config user.email "digimath-bot@users.noreply.github.com"
          git add -A content inbox
          git diff --cached --quiet || (git commit -m "unpack question pack" && git pull --rebase && git push)
